# Dependabot configuration — keeps dependencies fresh and patched.
# Docs: https://docs.github.com/en/code-security/dependabot/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Rust / Cargo dependencies (root Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(cargo)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  # GitHub Actions versions (.github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5

  # Docker base images (benchmarks/)
  - package-ecosystem: "docker"
    directory: "/benchmarks"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 3
