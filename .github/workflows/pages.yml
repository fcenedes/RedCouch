# Build the mdBook documentation site and deploy to GitHub Pages.
# Triggered on pushes to main and manually via workflow_dispatch.
# Requires GitHub Pages to be configured with Source: "GitHub Actions"
# in repository Settings → Pages.
name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'book.toml'
      - '.github/workflows/pages.yml'
      - 'Cargo.toml'  # version/description changes affect rustdoc
      - 'src/**'  # rebuild API docs when source changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.47/mdbook-v0.4.47-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build API reference (rustdoc)
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          # Place rustdoc output alongside the book under /api/
          cp -r target/doc book/output/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/output

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
