# Build the mdBook documentation site and deploy to GitHub Pages.
# Triggered on pushes to main and manually via workflow_dispatch.
# Requires GitHub Pages to be configured with Source: "GitHub Actions"
# in repository Settings → Pages.
name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'book.toml'
      - '.github/workflows/pages.yml'
      - 'Cargo.toml'  # version/description changes affect rustdoc
      - 'src/**'  # rebuild API docs when source changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.4.47"
  MDBOOK_SHA256: "3f66d94eb6e26cbcf64cb3a8bb7188d30818db3394668d8938868cc95f97c1e2"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o /tmp/mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  /tmp/mdbook.tar.gz" | shasum -a 256 --check
          tar xz -C "$HOME/.local/bin" -f /tmp/mdbook.tar.gz
          rm /tmp/mdbook.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build API reference (rustdoc)
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          # Place rustdoc output alongside the book under /api/
          cp -r target/doc book/output/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: book/output

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
