# Docker Compose for cross-system benchmark comparison
# All three targets run as containers for symmetric topology:
#   1. Redis OSS native      – direct Redis RESP GET/SET/DEL baseline
#   2. Couchbase OSS         – native memcached binary protocol baseline
#   3. Redis + RedCouch      – memcached binary protocol via RedCouch module
#
# Usage:
#   docker compose -f benchmarks/docker-compose.yml up -d --build
#   # Wait for services to be healthy, then run benchmarks
#   docker compose -f benchmarks/docker-compose.yml down -v

services:
  # Redis OSS - for native Redis GET/SET/DEL baseline measurement
  redis-bench:
    image: redis:8
    container_name: redcouch-bench-redis
    ports:
      - "16380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: "no"

  # Redis + RedCouch module - memcached binary protocol via containerized module
  # Built from source using benchmarks/Dockerfile.redcouch; same Redis 8 base
  # and memory settings as redis-bench for environment parity.
  redcouch-bench:
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile.redcouch
    container_name: redcouch-bench-redcouch
    ports:
      - "11210:11210"   # RedCouch memcached binary protocol listener
      - "16379:6379"    # Redis RESP (for diagnostics only)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: "no"

  # Couchbase Community Edition - for native memcached binary protocol baseline
  # Uses Couchbase 7.2 Community which supports memcached bucket type
  couchbase-bench:
    image: couchbase/server:community-7.2.4
    container_name: redcouch-bench-couchbase
    ports:
      - "8091:8091"    # Web console
      - "8092:8092"    # Views
      - "8093:8093"    # Query
      - "11211:11210"  # KV/memcached binary protocol (mapped to 11211 to avoid conflict)
    environment:
      - COUCHBASE_ADMINISTRATOR_USERNAME=admin
      - COUCHBASE_ADMINISTRATOR_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/pools || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: "no"
