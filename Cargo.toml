[package]
name = "red_couch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Redis module bridging Couchbase memcached binary protocol clients to Redis 8+"
license = "MIT"
repository = "https://github.com/fcenedes/RedCouch"
readme = "README.md"
keywords = ["redis", "memcached", "couchbase", "module", "protocol"]
categories = ["database", "network-programming"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
redis-module = {version = "2.0.7"}
bytes        = "1"          # convenient byte buffer
byteorder    = "1"          # read big-endian ints
thiserror    = "2.0.12"          # nicer error enum
